name: Build Windows

on:
  workflow_call:

env:
  VULKAN_SDK: ''

jobs:
  build-linux-mingw64:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/build/windows-clang

    container:
      image: ghcr.io/openimageviewer/openimageviewer/oiv-builder-arch:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Trust checkout directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Cache Vulkan SDK
      uses: actions/cache@v4
      with:
        path: ${{ env.BUILD_DIR }}/_deps/vulkan-sdk
        key: vulkan-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('OIVLib/Renderers/OIVVKRenderer/VulkanSDK.cmake') }}

    - name: Configure CMake
      run: >
        cmake
        -G Ninja
        -S "$GITHUB_WORKSPACE"
        -B "$BUILD_DIR"
        -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/mingw-w64-x86_64.cmake"
        -DIMCODEC_BUILD_CODEC_WEBP=OFF
        -DFREETYPE_WRAPPER_BUILD_FRIBIDI=OFF
        -DMINGW_POST_BUILD_DONT_COPY_BINARIES=ON

    - name: Build
      run: cmake --build "$BUILD_DIR" -- -j$(nproc)

  build-windows:
    runs-on: windows-2025-vs2026
    env:
      BUILD_DIR: ${{ github.workspace }}/build/windows-clang

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Cache Vulkan SDK
      uses: actions/cache@v4
      with:
        path: ${{ env.BUILD_DIR }}/_deps/vulkan-sdk
        key: vulkan-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('OIVLib/Renderers/OIVVKRenderer/VulkanSDK.cmake') }}

    - name: Activate the Visual Studio development environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: >
        cmake -G Ninja -B "$env:BUILD_DIR"
        -S "$env:GITHUB_WORKSPACE"
        -DCMAKE_C_COMPILER=clang-cl
        -DCMAKE_CXX_COMPILER=clang-cl
        -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build "$env:BUILD_DIR"

    - name: Run renderer and CLI tests
      shell: pwsh
      run: |
        & "$env:BUILD_DIR/bin/tests.exe"
        if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }
        & "$env:BUILD_DIR/bin/tests_vk_failures.exe"
        if ($LASTEXITCODE -ne 0) { throw "Vulkan failure tests failed" }
        & "$env:BUILD_DIR/bin/tests_vk_runtime_failure.exe"
        if ($LASTEXITCODE -ne 0) { throw "Vulkan loader tests failed" }
