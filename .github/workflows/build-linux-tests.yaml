name: Build Linux tests

on:
  workflow_call:

jobs:
  build-linux-tests:
    name: ${{ matrix.compiler.name }}
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/build/linux-${{ matrix.compiler.name }}-tests

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: clang
            cc: clang
            cxx: clang++
            linker_flags: -fuse-ld=lld
        # GCC14 is required before re-enabling the gcc matrix entry.
        # - name: gcc
        #   cc: gcc
        #   cxx: g++

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Show tool versions
      run: |
        cmake --version
        ninja --version
        ${{ matrix.compiler.cc }} --version
        ${{ matrix.compiler.cxx }} --version

    - name: Run release publishing tests
      shell: pwsh
      run: |
        Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
        Import-Module Pester -RequiredVersion 4.10.1 -Force
        $result = Invoke-Pester -Script "Tests/PowerShell/Publish-GitHubRelease.Tests.ps1" -PassThru
        if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) release publishing tests failed."
        }

    - name: Install linker
      if: matrix.compiler.name == 'clang'
      run: |
        sudo apt-get update
        sudo apt-get install -y lld

    - name: Configure CMake
      run: >
        cmake
        -G Ninja
        -S "$GITHUB_WORKSPACE"
        -B "$BUILD_DIR"
        -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
        -DCMAKE_EXE_LINKER_FLAGS=${{ matrix.compiler.linker_flags }}
        -DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.compiler.linker_flags }}
        -DCMAKE_MODULE_LINKER_FLAGS=${{ matrix.compiler.linker_flags }}
        -DCMAKE_BUILD_TYPE=Release
        -DOIV_BUILD_CLIENT=OFF
        -DOIV_BUILD_RENDERER_GL=OFF
        -DOIV_BUILD_TESTS=ON
        -DIMCODEC_BUILD_EXAMPLES=OFF

    - name: Build tests
      run: cmake --build "$BUILD_DIR" --target tests -- -j$(nproc)

    - name: Run tests
      run: "$BUILD_DIR/bin/tests"
