name: Package and Upload Builds

run-name: Publish ${{ inputs.official_release && 'official release' || 'snapshot' }} for ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows:
      - Build all
    types:
      - completed
  workflow_dispatch:
    inputs:
      official_release:
        description: Publish a stable Major.Minor.Patch release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  VULKAN_SDK: ''
  PUBLISH_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  OFFICIAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.official_release || false }}

jobs:
  build-package:
    name: Build ${{ matrix.platform }} release package
    # Manual runs bypass CI validation; automatic runs require a successful push build on the release branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == (vars.SNAPSHOT_RELEASE_BRANCH || 'master')
      )
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GCC_VERSION: '14.4.0'
      GCC_SHA256: '752b6f567beac83159c77a7680b1316bdd784738bff9a9d070112c09da90f6d9'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: Windows
            runner: windows-2025-vs2026
          - platform: Linux
            runner: ubuntu-24.04
    concurrency:
      group: package-releases-${{ matrix.platform }}-${{ inputs.official_release && (github.event.workflow_run.head_sha || github.sha) || 'snapshot' }}
      cancel-in-progress: ${{ ! inputs.official_release }}

    steps:
      - name: Checkout publish commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.PUBLISH_SHA }}
          # Keep full main-repository history so publish.ps1 can extract the Git revision count.
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Checkout shallow submodules
        run: git submodule update --init --recursive --depth 1

      - name: Install Linux toolchain and dependencies
        if: matrix.platform == 'Linux'
        run: |
          # Pin the installer so release toolchain setup changes only through review.
          curl --proto '=https' --tlsv1.2 -fsSLo llvm.sh https://raw.githubusercontent.com/opencollab/llvm-jenkins.debian.net/c5ecff7c7208c8b5225e1f6e6ae6f2539e1d31ea/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y llvm-22 libvulkan-dev libgl1-mesa-dev libgtk-3-dev libwayland-dev libx11-dev libdbus-1-dev libxkbcommon-dev p7zip-full wayland-protocols libgmp-dev libmpfr-dev libmpc-dev
          # GCC_ROOT redirects the host compiler's headers. Keep our variable project-specific.
          echo "OIV_GCC_ROOT=$RUNNER_TOOL_CACHE/gcc-$GCC_VERSION" >> "$GITHUB_ENV"

      - name: Cache GCC 14.4 toolchain
        if: matrix.platform == 'Linux'
        id: gcc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OIV_GCC_ROOT }}
          key: gcc-${{ env.GCC_VERSION }}-ubuntu-24.04-${{ runner.arch }}-${{ env.GCC_SHA256 }}-${{ hashFiles('.github/scripts/Build-Gcc.ps1') }}

      - name: Build GCC 14.4 toolchain
        if: matrix.platform == 'Linux' && steps.gcc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: >-
          ./.github/scripts/Build-Gcc.ps1
          -Version $env:GCC_VERSION
          -Sha256 $env:GCC_SHA256
          -InstallPrefix $env:OIV_GCC_ROOT
          -WorkDirectory "$env:RUNNER_TEMP/gcc-build"

      - name: Upload GCC bootstrap diagnostics
        if: failure() && matrix.platform == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gcc-bootstrap-diagnostics
          path: |
            ${{ runner.temp }}/gcc-build/bootstrap.log
            ${{ runner.temp }}/gcc-build/**/config.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Select GCC 14.4 headers and runtime for Clang
        if: matrix.platform == 'Linux'
        run: |
          set -euo pipefail
          test "$("$OIV_GCC_ROOT/bin/g++" -dumpfullversion -dumpversion)" = "$GCC_VERSION"
          "$OIV_GCC_ROOT/bin/g++" --version
          clang++-22 --version
          echo "CC=clang-22" >> "$GITHUB_ENV"
          echo "CXX=clang++-22" >> "$GITHUB_ENV"
          echo "CFLAGS=--gcc-toolchain=$OIV_GCC_ROOT" >> "$GITHUB_ENV"
          echo "CXXFLAGS=--gcc-toolchain=$OIV_GCC_ROOT" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$OIV_GCC_ROOT/lib64:$OIV_GCC_ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          # Check the compiler's selection rather than trusting that the environment flags were accepted.
          runtime="$(realpath -e "$(clang++-22 --gcc-toolchain="$OIV_GCC_ROOT" -print-file-name=libstdc++.so.6)")"
          test -f "$runtime"
          if [[ "$runtime" != "$OIV_GCC_ROOT/"* ]]; then
            echo 'Clang did not select the cached GCC runtime' >&2
            exit 1
          fi
          echo "Selected libstdc++: $runtime"

      - name: Save GCC 14.4 toolchain
        if: matrix.platform == 'Linux' && steps.gcc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OIV_GCC_ROOT }}
          key: ${{ steps.gcc-cache.outputs.cache-primary-key }}

      - name: Cache Vulkan SDK
        uses: actions/cache@v4
        with:
          path: publish/_deps/vulkan-sdk
          key: vulkan-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('OIVLib/Renderers/OIVVKRenderer/VulkanSDK.cmake') }}

      - name: Build release binaries
        shell: pwsh
        run: ./publish.ps1 -OfficialBuild $true -OfficialRelease ([bool]::Parse($env:OFFICIAL_RELEASE)) -EnablePackage $false -CMakeDefinitions @{ lerc = "OFF" }

      - name: Bundle Linux libstdc++ runtime
        if: matrix.platform == 'Linux'
        run: |
          for library in libstdc++.so.6 libgcc_s.so.1; do
            source_path="$(realpath -e "$(clang++-22 --gcc-toolchain="$OIV_GCC_ROOT" -print-file-name="$library")")"
            test -f "$source_path"
            if [[ "$source_path" != "$OIV_GCC_ROOT/"* ]]; then
              echo "Runtime is outside the cached GCC toolchain: $source_path" >&2
              exit 1
            fi
            cp --dereference "$source_path" "publish/bin/$library"
          done

      - name: Package release
        shell: pwsh
        run: ./publish.ps1 -OfficialBuild $true -OfficialRelease ([bool]::Parse($env:OFFICIAL_RELEASE)) -EnableConfigure $false -EnableBuild $false

      # The frontend replaces the executable target, so give WLX its own CMake cache and output directory.
      # Linux retains its standalone package until a GTK/Qt lister frontend exists.
      - name: Build and stage Windows WLX package
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          ./publish.ps1 -BuildDir publish-wlx -BuildTarget package_wlx -EnablePackage $false -OfficialBuild $true -OfficialRelease ([bool]::Parse($env:OFFICIAL_RELEASE)) -CMakeDefinitions @{
              lerc = "OFF"
              OIV_BUILD_WLX = "ON"
              OIV_BUILD_RENDERER_D3D11 = "ON"
              OIV_BUILD_RENDERER_VK = "OFF"
              OIV_BUILD_RENDERER_GL = "OFF"
              OIV_BUILD_TESTS = "OFF"
              LWS_BUILD_TESTS = "OFF"
          }
          if ($LASTEXITCODE -ne 0) { throw "WLX packaging failed" }
          $runtime = @(Get-ChildItem -LiteralPath publish -Recurse -File | Where-Object { $_.Name -match '^OIV-.+-Win32-[^-]+-[^-.]+\.7z$' })
          if ($runtime.Count -ne 1) { throw "Expected exactly one Windows runtime archive for WLX naming" }
          # Reuse the runtime basename to keep release version, source hash and platform naming identical.
          Copy-Item -LiteralPath "publish-wlx/OIViewer-wlx-x64.zip" -Destination (Join-Path $runtime[0].DirectoryName "$($runtime[0].BaseName)-WLX.zip")

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.platform }}
          path: publish/**/OIV-*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish release
    needs: build-package
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.official_release && 'official-release' || 'snapshot-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    concurrency:
      group: publish-releases-${{ inputs.official_release && (github.event.workflow_run.head_sha || github.sha) || 'snapshot' }}
      cancel-in-progress: false
    env:
      RELEASE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          path: release-package
          merge-multiple: true

      - name: Select downloaded archives
        id: package
        shell: pwsh
        run: |
          . ./.github/scripts/Publish-GitHubRelease.ps1
          $packages = Get-ReleasePackageSet -Directory "release-package" -OfficialRelease ([bool]::Parse($env:OFFICIAL_RELEASE))
          $outputs = [ordered]@{
              windows_runtime_archive_path = $packages.WindowsRuntimeArchivePath
              linux_runtime_archive_path = $packages.LinuxRuntimeArchivePath
              windows_wlx_archive_path = $packages.WindowsWlxArchivePath
              symbols_archive_path = $packages.SymbolsArchivePath
              release_title = $packages.ReleaseTitle
              release_tag = $packages.ReleaseTag
              prerelease = $packages.Prerelease.ToString().ToLowerInvariant()
          }
          foreach ($entry in $outputs.GetEnumerator()) {
              "$($entry.Key)=$($entry.Value)" >> $env:GITHUB_OUTPUT
              Write-Host "$($entry.Key): $($entry.Value)"
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          RELEASE_TARGET: ${{ env.PUBLISH_SHA }}
          RELEASE_TITLE: ${{ steps.package.outputs.release_title }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
          WINDOWS_RUNTIME_ARCHIVE_PATH: ${{ steps.package.outputs.windows_runtime_archive_path }}
          LINUX_RUNTIME_ARCHIVE_PATH: ${{ steps.package.outputs.linux_runtime_archive_path }}
          WINDOWS_WLX_ARCHIVE_PATH: ${{ steps.package.outputs.windows_wlx_archive_path }}
          SYMBOLS_ARCHIVE_PATH: ${{ steps.package.outputs.symbols_archive_path }}
        run: >
          ./.github/scripts/Publish-GitHubRelease.ps1
          -Repository $env:RELEASE_REPOSITORY
          -Tag $env:RELEASE_TAG
          -TargetSha $env:RELEASE_TARGET
          -Title $env:RELEASE_TITLE
          -Prerelease ([bool]::Parse($env:PRERELEASE))
          -MutableTag ([bool]::Parse($env:PRERELEASE))
          -Archives @($env:WINDOWS_RUNTIME_ARCHIVE_PATH, $env:LINUX_RUNTIME_ARCHIVE_PATH, $env:WINDOWS_WLX_ARCHIVE_PATH, $env:SYMBOLS_ARCHIVE_PATH)
