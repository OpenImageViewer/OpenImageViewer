name: Build Linux

on:
  workflow_call:

env:
  VULKAN_SDK: ''

jobs:
  build-linux:
    name: ${{ matrix.compiler.name }}
    runs-on: ubuntu-26.04
    env:
      BUILD_DIR: ${{ github.workspace }}/build/linux-${{ matrix.compiler.name }}

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: clang
            cc: clang
            cxx: clang++
        # GCC14 is required before re-enabling the gcc matrix entry.
        # - name: gcc
        #   cc: gcc
        #   cxx: g++

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Show tool versions
      run: |
        cmake --version
        ninja --version
        ${{ matrix.compiler.cc }} --version
        ${{ matrix.compiler.cxx }} --version

    - name: Run release publishing tests
      shell: pwsh
      run: |
        Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
        Import-Module Pester -RequiredVersion 4.10.1 -Force
        $result = Invoke-Pester -Script "Tests/PowerShell" -PassThru
        if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) release publishing tests failed."
        }

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libgtk-3-dev libvulkan-dev libwayland-dev libx11-dev libdbus-1-dev libxkbcommon-dev dbus-daemon lld wayland-protocols weston

    - name: Cache Vulkan SDK
      uses: actions/cache@v4
      with:
        path: ${{ env.BUILD_DIR }}/_deps/vulkan-sdk
        key: vulkan-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Renderers/OIVVKRenderer/VulkanSDK.cmake') }}

    - name: Configure CMake
      run: >
        cmake
        -G Ninja
        -S "$GITHUB_WORKSPACE"
        -B "$BUILD_DIR"
        -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
        -DCMAKE_BUILD_TYPE=Release
        -DOIV_BUILD_CLIENT=ON
        -DOIV_BUILD_TESTS=ON
        -DLWS_BUILD_TESTS=ON
        -DIMCODEC_BUILD_EXAMPLES=OFF

    - name: Build
      run: cmake --build "$BUILD_DIR" -- -j$(nproc)

    - name: Run tests
      run: |
        # Native LWS cases need a compositor in addition to the private portal bus.
        export XDG_RUNTIME_DIR="$(mktemp -d)"
        export WAYLAND_DISPLAY=oiv-ci
        export LIBGL_ALWAYS_SOFTWARE=1
        unset WAYLAND_SOCKET
        weston --backend=headless --renderer=pixman --socket="$WAYLAND_DISPLAY" \
          --idle-time=0 --no-config --log="$BUILD_DIR/weston.log" &
        weston_pid=$!
        # Release the private display even when a test fails.
        cleanup() {
          kill "$weston_pid" 2>/dev/null || true
          wait "$weston_pid" 2>/dev/null || true
          rm -rf "$XDG_RUNTIME_DIR"
        }
        trap cleanup EXIT
        # Bound startup waiting and show Weston's log if its socket never appears.
        if ! timeout 10s bash -c 'until [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; do sleep 0.1; done'; then
          cat "$BUILD_DIR/weston.log"
          exit 1
        fi
        dbus-run-session --config-file=External/LWS/tests/portal-session.conf -- env LWS_TEST_PORTAL_BUS=1 "$BUILD_DIR/bin/LWSTests"
        "$BUILD_DIR/bin/tests"
        "$BUILD_DIR/bin/tests_imagecodec"
        "$BUILD_DIR/bin/tests_logging"
        "$BUILD_DIR/bin/tests_utilities"
        "$BUILD_DIR/bin/tests_oivshared"
        "$BUILD_DIR/bin/tests_oivappcore"
        "$BUILD_DIR/bin/tests_oiviewer"
        "$BUILD_DIR/bin/tests_file_associations"
        "$BUILD_DIR/bin/tests_oivglrenderer"
        "$BUILD_DIR/bin/tests_vk_renderer"
        "$BUILD_DIR/bin/tests_font_encoding"
        "$BUILD_DIR/bin/tests_vk_failures"
